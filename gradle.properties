# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official

# AGP 9 refuses the classic library plugin next to Kotlin Multiplatform, and
# this module ships native code: the JNI bridge that loads the guest JVM is a
# .so in the AAR, and `externalNativeBuild` is the only DSL that puts it there.
# AGP names these two switches as the way to keep that combination working, so
# they are set here deliberately rather than by accident.
android.builtInKotlin=false
android.newDsl=false

#
# How JitPack builds this project. It reads this file from the commit it is
# building — so it must be committed before the tag that is published — and
# everything in it is about the two ways JitPack's image differs from a
# developer machine: which JDK runs Gradle, and what the Android SDK contains.
#
# JitPack runs `./gradlew build publishToMavenLocal` for a Gradle project and
# then serves whatever landed in ~/.m2/repository, so nothing else is needed to
# publish: the `maven-publish` plugin and its publications are already in
# jengine/build.gradle.kts.

# `gradle/gradle-daemon-jvm.properties` asks the Gradle daemon for JDK 25 (it
# carries foojay URLs, so Gradle would otherwise download one mid-build). Asking
# JitPack for the same JDK keeps the build to one JVM and one download.
jdk:
  - openjdk25

# The image's Android SDK is old, and this library compiles a native bridge for
# four ABIs, so the three heavyweight components AGP would otherwise fetch one
# failed build at a time are installed up front. `yes` answers the licence
# prompt; `|| true` keeps a component the image already carries from failing the
# step and taking the whole build with it. The NDK version is the one
# `jengine/build.gradle.kts` pins and the CMake one is what its
# `externalNativeBuild` block names.
before_install:
  - yes | sdkmanager --install "platforms;android-37" "ndk;28.2.13676358" "cmake;3.22.1" || true
